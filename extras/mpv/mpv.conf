# bench-grid: mpv OSD colours, installed to ~/.config/mpv/mpv.conf by the theme-set hook
# (removed on other themes; left alone if you keep your own mpv.conf). Subtitles are untouched.
# Cream text on a graphite outline; amber only for the selected item in lists.
osd-font="Sora"
osd-font-size=30
osd-color="#eee8dc"
osd-outline-color="#17201c"
osd-outline-size=1.5
osd-shadow-offset=0
osd-selected-color="#f3a712"
osd-selected-outline-color="#17201c"
osd-bar-outline-size=0.6
