# Bench Grid — a cutting mat, cream keycaps, graphite monitors, one amber task light.
#
# Core tokens (from the workstation):
#   mat        #174d3a   mat shadow #0d2f25   keycap #eee8dc
#   graphite   #17201c   task light #f3a712   pine   #c78a4b   muted green #a8c7b7
