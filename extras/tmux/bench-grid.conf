# bench-grid: tmux status line, sourced from a marked block the theme-set hook adds to
# ~/.config/tmux/tmux.conf. It only overrides the options Omarchy's tmux.conf "Theme"
# section sets, so re-sourcing tmux.conf restores them when another theme is active.
# Bar on the mat; amber only for the current window, the active pane and mode flags.
set -g status-style "bg=#0d2f25,fg=#a8c7b7"
set -g status-left "#[fg=#17201c,bg=#eee8dc,bold] #S #[bg=#0d2f25] "
set -g status-right "#[fg=#f3a712,bold]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#6f857a,nobold]#h "
set -g window-status-format "#[fg=#6f857a] #I:#W "
set -g window-status-current-format "#[fg=#17201c,bg=#f3a712,bold] #I:#W "
set -g pane-border-style "fg=#26362f"
set -g pane-active-border-style "fg=#f3a712"
set -g message-style "bg=#0d2f25,fg=#eee8dc"
set -g message-command-style "bg=#0d2f25,fg=#eee8dc"
set -g mode-style "bg=#174d3a,fg=#eee8dc"
setw -g clock-mode-colour "#a8c7b7"
