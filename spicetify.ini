; Bench Grid for Spotify (spicetify colour scheme). Graphite player, mat-shadow sidebar,
; mat-green selected rows, amber only on the play button and notifications.
; Use it as the [Omarchy] scheme in ~/.config/spicetify/Themes/Omarchy/color.ini.
[Omarchy]
text               = eee8dc
subtext            = a8c7b7
main               = 17201c
main-elevated      = 1e2a25
highlight          = 26362f
highlight-elevated = 2e4038
sidebar            = 0d2f25
player             = 111814
card               = 1e2a25
shadow             = 0b110e
selected-row       = a8c7b7
button             = f3a712
button-active      = f6b83d
button-disabled    = 42584d
tab-active         = 174d3a
notification       = 174d3a
notification-error = c2553b
misc               = 42584d
